<!doctype html>
<html lang="pl">
<head>
  <title>Gra o Japuszkach</title>
  <meta charset='UTF-8'>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      background-color: #1a1a1a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .hello-message {
      text-align: center;
      background: #2a2a2a;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 500px;
    }
    .logout-messages {
      pointer-events: none;
      color: #ff4d4d;
      margin: 20px;
      position: fixed;
      top: 0;
      left: 0;
      font-weight: bold;
      text-shadow: 1px 1px #000;
      z-index: 9999;
    }
    .btn-start {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-start:hover {
      background-color: #218838;
    }
    #loading-screen {
      display: none;
      text-align: center;
    }
    .spinner {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #28a745;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div id="main-container">
  <div class='hello-message' id="start-box">
    <h1>SIEMANOO</h1>
    <p>Gre o japuszkach.Tworzył Aluni.</p>
    <p><strong>Kliknij przycisk poniżej, aby rozpocząć grę.</strong></p>
    <button class="btn-start" id="start-btn">ROZPOCZNIJ GRĘ</button>
  </div>

  <div id="loading-screen" class='hello-message'>
    <h2>Ładowanie gry...</h2>
    <div class="spinner"></div>
    <p>Proszę czekać, trwa inicjalizacja zasobów (9 sekund)...</p>
  </div>
</div>

<div class='logout-messages'></div>

<script src='index.js'></script>   

</body>
</html>
